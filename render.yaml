services:
  - type: web
    name: aptispace
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /AptiSpace/
    envVars:
      - key: PORT
        value: 8080
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: aptispace-db
          property: connectionString
      - key: APTISPACE_SESSION_SECRET
        generateValue: true

databases:
  - name: aptispace-db
    plan: starter
